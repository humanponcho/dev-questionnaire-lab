<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Questionnaire Lab</title>
    <!-- Share Tech Mono (code/labels), Orbitron (headings), Rajdhani (prose).
         A <link> rather than an @import in the stylesheet: an @import blocks
         the CSS parse until it resolves, and preconnect cannot help it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400..900&family=Rajdhani:wght@300;400;500;600;700&display=swap"
    />
    <!-- Inline SVG icon: avoids a 404 for /favicon.ico without shipping a file. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>" />
    <!-- Babel standalone lets us compile student-written JSX in the browser at runtime -->
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
